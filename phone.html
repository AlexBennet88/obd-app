<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluetooth Тест</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      background: #0f172a;
      color: #f8fafc;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    button:active { background: #1d4ed8; }
    /* Экрана логов вместо консоли */
    #screen-log {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      min-height: 200px;
      max-height: 350px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .info { color: #38bdf8; }
  </style>
</head>
<body>

  <h2>Web Bluetooth Сканер</h2>
  <button id="btn">🔌 Выбрать устройство</button>

  <p>Результат вывода:</p>
  <div id="screen-log">Нажми кнопку вверху...</div>

  <script>
    // Функция пишет прямо в блок на экране
    function print(text, colorClass = '') {
      const logDiv = document.getElementById('screen-log');
      const time = new Date().toLocaleTimeString('ru');
      const span = colorClass ? `<span class="${colorClass}">${text}</span>` : text;
      logDiv.innerHTML += `<br>[${time}] ${span}`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function startBluetooth() {
      print('1. Открываю окно поиска...', 'info');
      
      try {
        // Шаг 1: Поиск устройства
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true
        });

        print(`2. Найдено: ${device.name || 'Устройство без имени'}`, 'ok');
        print(`> ID устройства: ${device.id}`, 'info');

        // Шаг 2: Реальное подключение (GATT)
        print('3. Подключаюсь к GATT-серверу...', 'info');
        const server = await device.gatt.connect();
        
        print('✅ УСПЕШНО ПОДКЛЮЧЕНО!', 'ok');
        print(`> Статус связи: ${server.connected}`, 'ok');

      } catch (error) {
        print(`❌ Ошибка: ${error.message}`, 'err');
      }
    }

    document.getElementById('btn').addEventListener('click', startBluetooth);
  </script>
</body>
</html>
