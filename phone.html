<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch UUID Explorer</title>
  <style>
    body {
      font-family: monospace;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 16px;
    }
    #output {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 13px;
    }
    .service-title { color: #38bdf8; font-weight: bold; margin-top: 10px; }
    .char-item { color: #4ade80; padding-left: 15px; }
    .writable { color: #facc15; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🔍 Сканер UUID Ваших Часов</h2>
  <button id="scanBtn">Сканировать часы</button>

  <div id="output">Нажмите кнопку и выберите часы в списке...</div>

  <script>
    const btn = document.getElementById('scanBtn');
    const out = document.getElementById('output');

    function print(text, className = '') {
      const div = document.createElement('div');
      if (className) div.className = className;
      div.innerText = text;
      out.appendChild(div);
      out.scrollTop = out.scrollHeight;
    }

    btn.addEventListener('click', async () => {
      out.innerHTML = '';
      try {
        print('1. Поиск устройства...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            'battery_service',
            'device_information',
            'generic_access',
            'current_time'
          ]
        });

        print(`2. Подключение к ${device.name || 'Девайсу'}...`);
        const server = await device.gatt.connect();
        print('✅ GATT Подключен! Сканируем сервисы...\n');

        const services = await server.getPrimaryServices();

        for (const service of services) {
          print(`📂 СЕРВИС: ${service.uuid}`, 'service-title');
          
          try {
            const characteristics = await service.getCharacteristics();
            for (const char of characteristics) {
              const props = [];
              if (char.properties.read) props.push('READ');
              if (char.properties.write) props.push('WRITE');
              if (char.properties.writeWithoutResponse) props.push('WRITE_NO_RESP');
              if (char.properties.notify) props.push('NOTIFY');

              const isWritable = char.properties.write || char.properties.writeWithoutResponse;
              const tag = isWritable ? ' 👈 (СЮДА МОЖНО ПИСАТЬ!)' : '';
              
              print(`   📄 Характеристика: ${char.uuid}`, 'char-item');
              print(`      Права: [${props.join(', ')}]${tag}`, isWritable ? 'writable' : '');
            }
          } catch (e) {
            print(`   ⚠️ Ошибка чтения характеристик: ${e.message}`);
          }
        }

        print('\n🎉 Сканирование завершено!');

      } catch (err) {
        print(`❌ Ошибка: ${err.message}`);
      }
    });
  </script>
</body>
</html>
