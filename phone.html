<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Watch Battery</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { background: #1d4ed8; }
    #battery-display {
      margin-top: 30px;
      padding: 20px;
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
    }
    #level {
      font-size: 48px;
      font-weight: bold;
      color: #4ade80;
    }
    #status {
      margin-top: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h2>⌚ Заряд смарт-часов</h2>
  <button id="connectBtn">Подключить часы</button>

  <div id="battery-display">
    <div id="level">--%</div>
    <div id="status">Нажмите кнопку для поиска</div>
  </div>

  <script>
    const btn = document.getElementById('connectBtn');
    const levelEl = document.getElementById('level');
    const statusEl = document.getElementById('status');

    btn.addEventListener('click', async () => {
      try {
        statusEl.innerText = 'Поиск часов...';

        // 1. Ищем устройство
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['battery_service', 0x180f]
        });

        statusEl.innerText = `Подключение к ${device.name}...`;

        // 2. Подключаемся к GATT
        const server = await device.gatt.connect();

        // 3. Получаем сервис и характеристику
        const service = await server.getPrimaryService('battery_service');
        const characteristic = await service.getCharacteristic('battery_level');

        // 4. Считываем значение
        const value = await characteristic.readValue();
        const batteryPercent = value.getUint8(0);

        // 5. Выводим результат
        levelEl.innerText = `${batteryPercent}%`;
        statusEl.innerText = `Часы: ${device.name}`;

      } catch (error) {
        statusEl.innerText = `Ошибка: ${error.message}`;
      }
    });
  </script>
</body>
</html>
