<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLE Battery Scanner</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    button:active { background: #1d4ed8; }
    #screen-log {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      min-height: 250px;
      max-height: 450px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .info { color: #38bdf8; }
    .warn { color: #facc15; }
  </style>
</head>
<body>

  <h2>🔍 Проверка GATT Батареи Havit</h2>
  <button id="btn">Сканировать наушники</button>

  <div id="screen-log">Нажмите кнопку для проверки...</div>

  <script>
    function print(text, colorClass = '') {
      const logDiv = document.getElementById('screen-log');
      const time = new Date().toLocaleTimeString('ru');
      const span = colorClass ? `<span class="${colorClass}">${text}</span>` : text;
      logDiv.innerHTML += `<br>[${time}] ${span}`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function scanServices() {
      print('1. Поиск устройства...', 'info');

      try {
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['battery_service', 'device_information']
        });

        print(`2. Выбрано: ${device.name || 'Без имени'}`, 'ok');
        print('3. Подключаюсь к GATT...', 'info');

        const server = await device.gatt.connect();
        print('✅ GATT Подключен!', 'ok');
        
        // --- ПРОВЕРКА BATTERY SERVICE ---
        print('4. Проверяю наличие Battery Service (0x180F)...', 'info');
        
        try {
          const batteryService = await server.getPrimaryService('battery_service');
          print('👉 Сервис 0x180F найден! <b class="ok">[БАТАРЕЯ ПОДДЕРЖИВАЕТСЯ]</b>');
          
          // Пробуем считать сам процент заряда
          const char = await batteryService.getCharacteristic('battery_level');
          const value = await char.readValue();
          const level = value.getUint8(0);
          
          print('-----------------------------------');
          print(`🎉 Уровень заряда: ${level}%`, 'ok');

        } catch (e) {
          print('-----------------------------------');
          print('❌ В этих наушниках НЕТ стандартного BLE Battery Service.', 'err');
          print('Заряд передается исключительно через Bluetooth Classic (HFP/A2DP) или скрыт в кастомных сервисах.', 'warn');
        }

      } catch (error) {
        print(`❌ Ошибка подключения: ${error.message}`, 'err');
      }
    }

    document.getElementById('btn').addEventListener('click', scanServices);
  </script>
</body>
</html>
