<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renault ABS & Engine Диагностика</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --border: #22222e;
      --accent: #eab308; --accent2: #fef08a;
      --green: #4ade80; --red: #f87171; --blue: #3b82f6;
      --text: #f0f0f4; --muted: #6b7280;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex;
      flex-direction: column; align-items: center;
      justify-content: center; padding: 20px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px 28px;
      max-width: 420px; width: 100%;
      box-shadow: 0 0 40px rgba(234,179,8,0.05);
    }
    .header { text-align: center; margin-bottom: 24px; }
    .icon { font-size: 48px; margin-bottom: 12px; display: block; }
    h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .chat-tag {
      display: inline-block; font-size: 11px; padding: 4px 10px;
      border-radius: 8px; margin-top: 10px;
      background: rgba(234,179,8,0.1); color: var(--accent2);
      border: 1px solid rgba(234,179,8,0.2);
    }
    .rpm-display {
      background: #000; border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 16px;
      text-align: center;
    }
    .rpm-value { font-size: 36px; font-weight: 900; color: var(--green); font-family: monospace; }
    .rpm-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .btn {
      display: block; width: 100%; padding: 14px; border: none;
      border-radius: 12px; font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; margin-bottom: 10px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ca8a04, var(--accent));
      color: #000; box-shadow: 0 4px 20px rgba(234,179,8,0.25);
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-send {
      background: transparent; border: 1px solid var(--green);
      color: var(--green);
    }
    .btn-send:hover { background: rgba(74,222,128,0.08); }
    .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

    .status { margin: 14px 0; font-size: 13px; padding: 10px 14px; border-radius: 10px; display: none; }
    .status.visible { display: block; }
    .status.sending { background: rgba(59,130,246,0.12); color: var(--blue); }
    .status.sent    { background: rgba(74,222,128,0.12); color: var(--green); }
    .status.error   { background: rgba(248,113,113,0.12); color: var(--red); }
    .status.info    { background: rgba(250,204,21,0.10); color: var(--accent); }

    .divider { height: 1px; background: var(--border); margin: 18px 0; }
    .log { font-size: 11px; color: var(--muted); line-height: 1.8; font-family: 'Courier New', monospace; max-height: 160px; overflow-y: auto; }
    .log span { color: var(--accent2); }
    .log .err { color: var(--red); }
    .log .ok { color: var(--green); }
    .log .info { color: var(--blue); }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <span class="icon">🛑</span>
    <h1>Диагностика Renault</h1>
    <p class="subtitle">Чтение RPM и дилерский опрос ABS</p>
    <div class="chat-tag" id="chatTag">chat_id: —</div>
  </div>

  <div class="rpm-display">
    <div class="rpm-value" id="rpmValue">----</div>
    <div class="rpm-label">Обороты двигателя (RPM)</div>
  </div>

  <button class="btn btn-primary" id="connectBtn" onclick="connectAndRun()">🔌 Подключиться и читать OBD</button>
  <button class="btn btn-send" id="sendBtn" onclick="sendToTelegram()" disabled>📤 Отправить отчет в Telegram</button>

  <div class="status" id="status"></div>
  <div class="divider"></div>
  <div class="log" id="log">Инструкция: Включите зажигание или заведите двигатель.</div>
</div>

<script>
  const N8N_WEBHOOK_URL = 'https://unlisted-corner-proclaim.ngrok-free.dev/webhook/obd-receiver';
  const urlParams = new URLSearchParams(window.location.search); 
  const chatId = urlParams.get('chat_id') || ''; 
  document.getElementById('chatTag').textContent = 'chat_id: ' + (chatId || '⚠️ не передан');

  const OBD_PROFILES = [
    { name: 'Type A (fff0)', service: '0000fff0-0000-1000-8000-00805f9b34fb', notify: '0000fff1-0000-1000-8000-00805f9b34fb', write: '0000fff2-0000-1000-8000-00805f9b34fb' },
    { name: 'Type B (18f0)', service: '000018f0-0000-1000-8000-00805f9b34fb', notify: '00002af0-0000-1000-8000-00805f9b34fb', write: '00002af1-0000-1000-8000-00805f9b34fb' },
    { name: 'Type C (Vgate)', service: 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', notify: 'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f', write: 'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f' }
  ];

  let rawResult = '';
  let writeChar = null;
  let notifyChar = null;
  let responseBuffer = '';
  let pendingResolve = null;
  let timerId = null;

  function log(msg, type = '') {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString('ru');
    el.innerHTML += `<br><span>[${time}]</span> <span class="${type}">${msg}</span>`;
    el.scrollTop = el.scrollHeight;
  }

  function showStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = `status visible ${type}`;
  }

  function parseRPM(hexString) {
    const cleanStr = hexString.replace(/\r/g, ' ').replace(/\n/g, ' ').trim();
    const bytes = cleanStr.split(/\s+/);

    const startIndex = bytes.findIndex((b, idx) => b === '41' && bytes[idx + 1] === '0C');
    
    if (startIndex !== -1 && bytes.length >= startIndex + 4) {
      const byteA = parseInt(bytes[startIndex + 2], 16);
      const byteB = parseInt(bytes[startIndex + 3], 16);
      
      if (!isNaN(byteA) && !isNaN(byteB)) {
        return Math.round(((byteA * 256) + byteB) / 4);
      }
    }
    return null;
  }

  function onCharacteristicValueChanged(e) {
    const text = new TextDecoder().decode(e.target.value);
    responseBuffer += text;
    if ((responseBuffer.includes('>') || responseBuffer.includes('\r')) && pendingResolve) {
      const cb = pendingResolve;
      pendingResolve = null;
      if (timerId) clearTimeout(timerId);
      cb(responseBuffer);
    }
  }

  function sendCommand(cmd, customTimeout = 3000) {
    return new Promise((resolve) => {
      responseBuffer = '';
      if (timerId) clearTimeout(timerId);

      pendingResolve = (res) => {
        if (timerId) clearTimeout(timerId);
        resolve(res);
      };

      const data = new TextEncoder().encode(cmd + '\r');
      
      const writePromise = writeChar.writeValueWithResponse 
        ? writeChar.writeValueWithResponse(data)
        : writeChar.writeValue(data);

      writePromise.catch(err => log(`Ошибка записи: ${err.message}`, 'err'));

      timerId = setTimeout(() => {
        if (pendingResolve) {
          const fallback = responseBuffer;
          pendingResolve = null;
          resolve(fallback);
        }
      }, customTimeout);
    });
  }

  async function tryProfile(device, profile) {
    log(`Пробую профиль BLE: ${profile.name}`);
    try {
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(profile.service);
      writeChar = await service.getCharacteristic(profile.write);
      notifyChar = await service.getCharacteristic(profile.notify);

      notifyChar.removeEventListener('characteristicvaluechanged', onCharacteristicValueChanged);
      notifyChar.addEventListener('characteristicvaluechanged', onCharacteristicValueChanged);

      await notifyChar.startNotifications();
      log('Связь с ELM установлена!', 'ok');
      await sendCommand('AT Z', 2000);
      await sendCommand('AT E0', 1000);
      return true;
    } catch (e) {
      log(`Профиль мимо: ${e.message}`, 'err');
      try { if (device.gatt && device.gatt.connected) device.gatt.disconnect(); } catch (_) {}
      return false;
    }
  }

  async function connectAndRun() {
    if (!navigator.bluetooth) {
      showStatus('❌ Браузер не поддерживает Bluetooth! Откройте в Chrome или Bluefy.', 'error');
      log('❌ Ошибка: Web Bluetooth недоступен', 'err');
      return;
    }

    const btn = document.getElementById('connectBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Поиск адаптера...';
    log('Поиск Bluetooth устройств...');

    try {
      // КЛЮЧЕВОЙ ИСПРАВЛЕННЫЙ БЛОК ПОИСКА:
      // Передаем весь спектр сервисов в optionalServices
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [
          '0000fff0-0000-1000-8000-00805f9b34fb',
          '000018f0-0000-1000-8000-00805f9b34fb',
          'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
          '0000e077-0000-1000-8000-00805f9b34fb'
        ]
      });
      
      log(`Выбрано устройство: <span class="ok">${device.name || 'Без имени'}</span>`);

      showStatus('🔄 Инициализация профиля Bluetooth...', 'info');
      let connected = false;
      for (const profile of OBD_PROFILES) {
        connected = await tryProfile(device, profile);
        if (connected) break;
      }
      if (!connected) {
        showStatus('❌ Не удалось настроить каналы связи BLE', 'error');
        btn.textContent = '🔌 Подключиться и читать OBD';
        btn.disabled = false;
        return;
      }

      showStatus('📡 Инициализация адаптера (ATE0)...', 'sending');
      await sendCommand('AT Z', 1500);
      await sendCommand('AT E0', 1000);

      log('Запрос RPM (Mode 01 PID 0C)...', 'info');
      const rpmResponse = await sendCommand('010C', 2000);
      log(`Ответ RPM: <span class="ok">${rpmResponse.replace(/\r/g, ' ')}</span>`);
      
      const calculatedRpm = parseRPM(rpmResponse);
      if (calculatedRpm !== null) {
        document.getElementById('rpmValue').textContent = calculatedRpm;
        log(`✅ Обороты двигателя: ${calculatedRpm} RPM`, 'ok');
      } else {
        document.getElementById('rpmValue').textContent = 'N/A';
        log('⚠️ Не удалось разобрать RPM из ответа', 'err');
      }

      showStatus('📡 Опрос блока ABS...', 'sending');
      await sendCommand('AT H1');
      await sendCommand('AT L0');
      await sendCommand('AT AL');

      let finalResponse = '';

      log('Попытка 1: CAN bus (ID 740/760)');
      await sendCommand('AT SP 6');
      await sendCommand('AT SH 740');
      await sendCommand('AT CRA 760');
      await sendCommand('AT FC SH 740');
      await sendCommand('AT FC SD 30 00 00');
      await sendCommand('AT FC SM 1');

      let sessionRes = await sendCommand('10 C0', 1500);
      if (sessionRes.includes('7F')) {
        sessionRes = await sendCommand('10 85', 1500);
      }

      let canRes = await sendCommand('18 00 FF 00', 2500);
      if (canRes.includes('7F 18 11') || canRes.includes('NO DATA')) {
        canRes = await sendCommand('17 FF 00', 2500);
      }

      const isCanAlive = canRes.includes('58 ') || canRes.includes('57 ') || canRes.includes('5800') || canRes.includes('7F');

      if (isCanAlive) {
        finalResponse = `RPM: ${calculatedRpm || 'N/A'} | SESSION: ${sessionRes} DATA: ${canRes}`;
        log('✅ Блок ABS ответил по CAN!', 'ok');
      } else {
        log('⚠️ CAN молчит → Переключаемся на K-Line KWP2000...', 'info');
        await sendCommand('AT Z', 1500);
        await sendCommand('AT SP 4');
        await sendCommand('AT H1');
        await sendCommand('AT SH 81 7B F1');
        await sendCommand('AT FI', 3000);

        let klineRes = await sendCommand('18 02 FF 00', 3000);

        if (klineRes.includes('NO DATA') || klineRes.includes('?')) {
          await sendCommand('AT SH 81 F0 F1');
          await sendCommand('AT FI', 3000);
          klineRes = await sendCommand('18 02 FF 00', 3000);
        }

        finalResponse = `RPM: ${calculatedRpm || 'N/A'} | DATA: ${klineRes}`;
      }

      rawResult = finalResponse || 'NO_RESPONSE';

      if (rawResult.includes('NO DATA') || rawResult === 'NO_RESPONSE') {
        showStatus('❌ Блок не ответил. Проверьте зажигание!', 'error');
      } else {
        showStatus('✅ Данные успешно считаны!', 'sent');
      }

      document.getElementById('sendBtn').disabled = false;

    } catch (err) {
      log(`Ошибка: ${err.message}`, 'err');
      showStatus('❌ ' + err.message, 'error');
    }

    btn.textContent = '🔌 Повторить опрос';
    btn.disabled = false;
  }

  async function sendToTelegram() {
    if (!chatId) {
      showStatus('❌ Ошибка: chat_id не передан', 'error');
      return;
    }
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    showStatus('📤 Отправка в Telegram...', 'sending');

    try {
      const res = await fetch(N8N_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          raw: rawResult,
          chat_id: chatId,
          timestamp: new Date().toISOString()
        })
      });
      if (res.ok) {
        showStatus('🚀 Отчет отправлен!', 'sent');
        log('✅ Отправлено в n8n', 'ok');
      } else {
        throw new Error(`HTTP ${res.status}`);
      }
    } catch (err) {
      showStatus('❌ Ошибка отправки', 'error');
      log(`Ошибка HTTP: ${err.message}`, 'err');
    }
    btn.disabled = false;
  }
</script>
</body>
</html>
