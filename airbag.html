<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airbag (SRS) Расширенная Диагностика</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --border: #22222e;
      --accent: #ef4444; --accent2: #f87171;
      --green: #4ade80; --yellow: #facc15; --red: #f87171;
      --text: #f0f0f4; --muted: #6b7280;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex;
      flex-direction: column; align-items: center;
      justify-content: center; padding: 20px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 28px 24px;
      max-width: 440px; width: 100%;
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.08);
    }
    .header { text-align: center; margin-bottom: 20px; }
    .icon { font-size: 44px; margin-bottom: 8px; display: block; }
    h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .chat-tag {
      display: inline-block; font-size: 11px; padding: 4px 10px;
      border-radius: 8px; margin-top: 8px;
      background: rgba(239, 68, 68, 0.12); color: var(--accent2);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    /* Карточка состояния */
    .srs-status-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin-bottom: 16px;
    }
    .srs-title { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .srs-value { font-size: 18px; font-weight: 900; color: var(--text); margin-top: 4px; }

    /* Дашборд параметров SRS */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }
    .metric-title { font-size: 9px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .metric-value { font-size: 15px; font-weight: 800; color: var(--accent2); margin-top: 4px; }
    .metric-unit { font-size: 9px; color: var(--muted); }

    .btn {
      display: block; width: 100%; padding: 14px; border: none;
      border-radius: 12px; font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; margin-bottom: 10px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-send {
      background: transparent; border: 1px solid var(--green);
      color: var(--green);
    }
    .btn-send:hover { background: rgba(74,222,128,0.08); }
    .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

    .status { margin: 12px 0; font-size: 12px; padding: 10px 12px; border-radius: 10px; display: none; }
    .status.visible { display: block; }
    .status.sending { background: rgba(59,130,246,0.12); color: #60a5fa; }
    .status.sent    { background: rgba(74,222,128,0.12); color: var(--green); }
    .status.error   { background: rgba(248,113,113,0.12); color: var(--red); }
    .status.info    { background: rgba(250,204,21,0.10); color: var(--yellow); }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .log { font-size: 11px; color: var(--muted); line-height: 1.8; font-family: 'Courier New', monospace; max-height: 120px; overflow-y: auto; }
    .log span { color: var(--accent2); }
    .log .err { color: var(--red); }
    .log .ok { color: var(--green); }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <span class="icon">🦺</span>
    <h1>AIRBAG / SRS</h1>
    <p class="subtitle">Сканирование ошибок, пиропатронов и замков</p>
    <div class="chat-tag" id="chatTag">chat_id: —</div>
  </div>

  <div class="srs-status-box">
    <div class="srs-title">Статус DTC Ошибок</div>
    <div class="srs-value" id="srsState">Ожидание...</div>
  </div>

  <div class="dashboard">
    <div class="metric-card">
      <div class="metric-title">Crash Data (Удар)</div>
      <div class="metric-value" id="valCrash">—</div>
      <div class="metric-unit">флаг аварии</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Замок Ремень Вод.</div>
      <div class="metric-value" id="valBelt">—</div>
      <div class="metric-unit">состояние</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Подушка Водителя</div>
      <div class="metric-value" id="valOhmDriver">—</div>
      <div class="metric-unit">сопротивление</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Подушка Пассажира</div>
      <div class="metric-value" id="valOhmPass">—</div>
      <div class="metric-unit">сопротивление</div>
    </div>
  </div>

  <button class="btn btn-primary" id="connectBtn" onclick="connectOBD()">🔌 Проверить AIRBAG</button>
  <button class="btn btn-send" id="sendBtn" onclick="sendToTelegram()" disabled>📤 Отправить результат в Telegram</button>

  <div class="status" id="status"></div>
  <div class="divider"></div>
  <div class="log" id="log">Готов к подключению...</div>
</div>

<script>
  const N8N_WEBHOOK_URL = 'https://unlisted-corner-proclaim.ngrok-free.dev/webhook/obd-receiver';

  const urlParams = new URLSearchParams(window.location.search);
  const chatId = urlParams.get('chat_id') || '';
  document.getElementById('chatTag').textContent = 'chat_id: ' + (chatId || '⚠️ не передан');

  const OBD_PROFILES = [
    { name: 'Type A (fff0)', service: '0000fff0-0000-1000-8000-00805f9b34fb', notify: '0000fff1-0000-1000-8000-00805f9b34fb', write: '0000fff2-0000-1000-8000-00805f9b34fb' },
    { name: 'Type B (18f0)', service: '000018f0-0000-1000-8000-00805f9b34fb', notify: '00002af0-0000-1000-8000-00805f9b34fb', write: '00002af1-0000-1000-8000-00805f9b34fb' },
    { name: 'Type C (Vgate)', service: 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', notify: 'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f', write: 'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f' }
  ];

  let rawResult = '';
  let parsedData = {};
  let writeChar = null;
  let notifyChar = null;
  let responseBuffer = '';
  let pendingResolve = null;

  function log(msg, type = '') {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString('ru');
    el.innerHTML += `<br><span>[${time}]</span> <span class="${type}">${msg}</span>`;
    el.scrollTop = el.scrollHeight;
  }

  function showStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = `status visible ${type}`;
  }

  function sendCommand(cmd, timeoutMs = 1500) {
    return new Promise((resolve) => {
      responseBuffer = '';
      pendingResolve = resolve;
      const data = new TextEncoder().encode(cmd + '\r');
      writeChar.writeValue(data);
      setTimeout(() => { if (pendingResolve) { pendingResolve(responseBuffer); pendingResolve = null; } }, timeoutMs);
    });
  }

  function parseOBDBytes(hexStr) {
    const clean = hexStr.replace(/[\r\n\s>]/g, '');
    return clean.match(/[0-9A-Fa-f]{2}/g) || [];
  }

  // --- Функция парсинга сопротивления пиропатронов (в Омах) ---
  function parseOhm(hexStr) {
    const bytes = parseOBDBytes(hexStr);
    const idx = bytes.indexOf('62'); // Положительный ответ UDS 22 -> 62
    if (idx !== -1 && bytes.length >= idx + 4) {
      const val = parseInt(bytes[idx + 3], 16);
      // Масштаб расчёта: значение / 10 (например 25 = 2.5 Ом)
      return (val / 10).toFixed(1) + ' Ом';
    }
    return 'N/A';
  }

  // --- Функция парсинга статуса замка ремня ---
  function parseSeatbelt(hexStr) {
    const bytes = parseOBDBytes(hexStr);
    const idx = bytes.indexOf('62');
    if (idx !== -1 && bytes.length >= idx + 4) {
      const val = parseInt(bytes[idx + 3], 16);
      return (val & 0x01) ? 'Застёгнут' : 'Растёгнут';
    }
    return 'N/A';
  }

  // --- Функция парсинга флага Crash Data ---
  function parseCrashData(hexStr) {
    const bytes = parseOBDBytes(hexStr);
    const idx = bytes.indexOf('62');
    if (idx !== -1 && bytes.length >= idx + 4) {
      const val = parseInt(bytes[idx + 3], 16);
      return val > 0 ? 'CRASH DETECTED!' : 'Чисто (OK)';
    }
    return 'Чисто (OK)';
  }

  async function tryProfile(device, profile) {
    log(`Пробую профиль: ${profile.name}`);
    try {
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(profile.service);
      writeChar = await service.getCharacteristic(profile.write);
      notifyChar = await service.getCharacteristic(profile.notify);

      await notifyChar.startNotifications();
      notifyChar.addEventListener('characteristicvaluechanged', (e) => {
        const text = new TextDecoder().decode(e.target.value);
        responseBuffer += text;
        if (responseBuffer.includes('>') && pendingResolve) {
          pendingResolve(responseBuffer);
          pendingResolve = null;
        }
      });

      log('Подключено! Настройка ELM327...', 'ok');
      await sendCommand('AT Z', 2000);
      await sendCommand('AT E0');
      await sendCommand('AT SP 6'); // Фиксируем CAN 500k / 11bit
      return true;
    } catch (e) {
      log(`Не подошёл: ${e.message}`, 'err');
      try { device.gatt.disconnect(); } catch (_) {}
      return false;
    }
  }

  async function connectOBD() {
    const btn = document.getElementById('connectBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Чтение SRS...';
    log('Запрашиваю Bluetooth устройство...');

    try {
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: OBD_PROFILES.map(p => p.service)
      });
      log(`Устройство: <span class="ok">${device.name || 'Без имени'}</span>`);
      showStatus('🔄 Подключаюсь...', 'info');

      let connected = false;
      for (const profile of OBD_PROFILES) {
        connected = await tryProfile(device, profile);
        if (connected) { log(`✅ Профиль найден: ${profile.name}`, 'ok'); break; }
      }

      if (!connected) {
        showStatus('❌ Ни один профиль не подошёл', 'error');
        btn.textContent = '🔌 Проверить AIRBAG';
        btn.disabled = false;
        return;
      }

      showStatus('📡 Запрос параметров блока AIRBAG (771)...', 'sending');

      // 1. Установка адреса блока Airbag (771)
      log('Адресация: AT SH 771...');
      await sendCommand('AT SH 771');

      // 2. Чтение DTC Ошибок (19 02 AF)
      log('Запрос DTC ошибок (19 02 AF)...');
      const resDtc = await sendCommand('19 02 AF', 2000);
      rawResult = resDtc.replace(/\r/g, ' ').trim();

      // 3. Запрос флага Crash Data (22 01 0B)
      log('Проверка Crash Data (22 01 0B)...');
      const resCrash = await sendCommand('22 01 0B', 1200);
      const crashStatus = parseCrashData(resCrash);

      // 4. Запрос ремня безопасности (22 10 05)
      log('Чтение замка ремня (22 10 05)...');
      const resBelt = await sendCommand('22 10 05', 1200);
      const beltStatus = parseSeatbelt(resBelt);

      // 5. Сопротивление подушки водителя (22 10 01)
      log('Пиропатрон водителя (22 10 01)...');
      const resDriver = await sendCommand('22 10 01', 1200);
      const ohmDriver = parseOhm(resDriver);

      // 6. Сопротивление подушки пассажира (22 10 02)
      log('Пиропатрон пассажира (22 10 02)...');
      const resPass = await sendCommand('22 10 02', 1200);
      const ohmPass = parseOhm(resPass);

      // Отрисовка результатов на дашборде
      document.getElementById('valCrash').textContent = crashStatus;
      document.getElementById('valCrash').style.color = crashStatus.includes('CRASH') ? 'var(--red)' : 'var(--green)';

      document.getElementById('valBelt').textContent = beltStatus;
      document.getElementById('valOhmDriver').textContent = ohmDriver;
      document.getElementById('valOhmPass').textContent = ohmPass;

      const stateEl = document.getElementById('srsState');
      if (rawResult.includes('7F')) {
        stateEl.textContent = '⚠️ Блок отклонил запрос';
        stateEl.style.color = 'var(--yellow)';
      } else if (rawResult.includes('59 02') && !rawResult.includes('59 02 00 00')) {
        stateEl.textContent = '🛑 ОШИБКИ В СИСТЕМЕ';
        stateEl.style.color = 'var(--red)';
      } else {
        stateEl.textContent = '✅ Ошибок не найдено';
        stateEl.style.color = 'var(--green)';
      }

      // Формируем структурированный пакет данных для вебхука
      parsedData = {
        module: 'AIRBAG_SRS',
        raw_dtc: rawResult,
        crash_status: crashStatus,
        seatbelt_driver: beltStatus,
        ohm_driver_airbag: ohmDriver,
        ohm_passenger_airbag: ohmPass
      };

      document.getElementById('sendBtn').disabled = false;
      showStatus('✅ Данные SRS полностью собраны!', 'sent');

    } catch (err) {
      log(`Ошибка: ${err.message}`, 'err');
      showStatus('❌ ' + err.message, 'error');
    }

    btn.textContent = '🔌 Повторить сканирование';
    btn.disabled = false;
  }

  async function sendToTelegram() {
    if (!chatId) {
      showStatus('❌ Нет chat_id — открой ссылку из Telegram бота', 'error');
      return;
    }
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    showStatus('📡 Отправляю в n8n...', 'sending');
    try {
      const res = await fetch(N8N_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          module: 'AIRBAG_SRS',
          data: parsedData,
          raw: rawResult,
          chat_id: chatId,
          timestamp: new Date().toISOString()
        })
      });
      if (res.ok) {
        showStatus('✅ Отправлено! Проверяй Telegram', 'sent');
        log('Данные отправлены на n8n', 'ok');
      } else throw new Error(`HTTP ${res.status}`);
    } catch (err) {
      showStatus('❌ ' + err.message, 'error');
      log(`Ошибка отправки: ${err.message}`, 'err');
    }
    btn.disabled = false;
  }
</script>
</body>
</html>
